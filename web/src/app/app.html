<header class="app-header">
  <div class="header-content">
    <h1 class="app-title">{{ title() }}</h1>
    <p class="app-subtitle">Search and track astronaut career records</p>
  </div>
</header>

<main class="app-main">
  <div class="search-section">
    <app-astronaut-search (astronautSearched)="handleSearch($event)" />
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <div class="spinner"></div>
      <p class="loading-text">Searching for astronaut...</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="error-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <p class="error-message">{{ errorMessage() }}</p>
    </div>
  }

  @if (searchResults() && !isLoading()) {
    <div class="results-section">
      <app-astronaut-duty-list 
        [person]="searchResults()!.person" 
        [duties]="searchResults()!.astronautDuties"
      />
    </div>
  }
</main>

<router-outlet />
